<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="52%" r="72%">
      <stop offset="0" stop-color="#1f3326"/>
      <stop offset="0.6" stop-color="#101c15"/>
      <stop offset="1" stop-color="#070d0a"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffc24a" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#ff9a1f" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff9a1f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="forewing" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#eadbb8"/>
      <stop offset="1" stop-color="#b9a47c"/>
    </linearGradient>
    <linearGradient id="hindwing" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4a3d"/>
      <stop offset="1" stop-color="#b3161b"/>
    </linearGradient>
    <linearGradient id="lantern" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.5" stop-color="#ffc83d"/>
      <stop offset="1" stop-color="#ff8a14"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="22" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="hindClip">
      <path d="M500 470 C420 478 262 520 186 612 C170 706 256 772 362 748 C446 728 492 626 506 540 Z"/>
    </clipPath>
    <clipPath id="foreClip">
      <path d="M502 408 C428 298 262 214 136 244 C102 330 164 440 300 482 C392 508 462 482 502 458 Z"/>
    </clipPath>

    <!-- One side of the insect; the other side is mirrored. -->
    <g id="wings">
      <!-- hindwing: red with black spots, white band, dark edge -->
      <path d="M500 470 C420 478 262 520 186 612 C170 706 256 772 362 748 C446 728 492 626 506 540 Z"
            fill="url(#hindwing)" stroke="#120806" stroke-width="12" stroke-linejoin="round"/>
      <g clip-path="url(#hindClip)">
        <path d="M150 700 C220 640 300 700 420 760 L420 820 L150 820 Z" fill="#1b0f0c"/>
        <path d="M486 506 C410 520 300 580 250 668" fill="none" stroke="#f4efe6" stroke-width="30" stroke-linecap="round" opacity="0.92"/>
        <circle cx="250" cy="600" r="21" fill="#140b09"/>
        <circle cx="330" cy="560" r="17" fill="#140b09"/>
        <circle cx="400" cy="620" r="18" fill="#140b09"/>
        <circle cx="318" cy="668" r="15" fill="#140b09"/>
      </g>
      <!-- forewing: tan with black spots and a brick-patterned tip -->
      <path d="M502 408 C428 298 262 214 136 244 C102 330 164 440 300 482 C392 508 462 482 502 458 Z"
            fill="url(#forewing)" stroke="#120806" stroke-width="12" stroke-linejoin="round"/>
      <g clip-path="url(#foreClip)" fill="#1a130c">
        <circle cx="300" cy="330" r="19"/>
        <circle cx="380" cy="392" r="17"/>
        <circle cx="236" cy="384" r="16"/>
        <circle cx="320" cy="430" r="14"/>
        <circle cx="440" cy="436" r="13"/>
        <g opacity="0.75">
          <rect x="120" y="236" width="44" height="16" rx="4" transform="rotate(-18 142 244)"/>
          <rect x="140" y="272" width="40" height="14" rx="4" transform="rotate(-18 160 279)"/>
          <rect x="184" y="248" width="36" height="14" rx="4" transform="rotate(-18 202 255)"/>
          <rect x="128" y="310" width="34" height="13" rx="4" transform="rotate(-18 145 316)"/>
          <rect x="176" y="292" width="30" height="12" rx="4" transform="rotate(-18 191 298)"/>
        </g>
      </g>
      <!-- antenna -->
      <path d="M500 312 C486 272 468 250 440 236" fill="none" stroke="#0d0907" stroke-width="12" stroke-linecap="round"/>
      <circle cx="438" cy="234" r="11" fill="#ff5a3d"/>
    </g>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="560" r="400" fill="url(#halo)"/>

  <use xlink:href="#wings"/>
  <use xlink:href="#wings" transform="translate(1024 0) scale(-1 1)"/>

  <!-- body: head, thorax, glowing lantern abdomen -->
  <circle cx="512" cy="334" r="38" fill="#0d0907"/>
  <ellipse cx="512" cy="424" rx="44" ry="62" fill="#0d0907"/>
  <g filter="url(#glow)">
    <rect x="456" y="478" width="112" height="206" rx="48" fill="url(#lantern)"/>
  </g>
  <rect x="456" y="478" width="112" height="206" rx="48" fill="none" stroke="#5a2c05" stroke-width="10"/>
  <g stroke="#b8600c" stroke-width="7" stroke-linecap="round" opacity="0.7">
    <line x1="490" y1="498" x2="490" y2="664"/>
    <line x1="512" y1="494" x2="512" y2="668"/>
    <line x1="534" y1="498" x2="534" y2="664"/>
  </g>
  <rect x="470" y="462" width="84" height="26" rx="10" fill="#0d0907"/>
  <rect x="482" y="674" width="60" height="24" rx="10" fill="#0d0907"/>
  <path d="M512 698 L512 730" stroke="#0d0907" stroke-width="12" stroke-linecap="round"/>
</svg>
